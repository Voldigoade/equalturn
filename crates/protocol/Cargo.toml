[package]
name = "equalturn-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Versioned signed-event protocol for Equalturn sessions"

[dependencies]
ed25519-dalek = { version = "3.0.0", features = ["serde"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["serde", "v4"] }
zeroize = "1.9.1"

[dev-dependencies]
serde_json = "1.0.154"

[lints]
workspace = true
