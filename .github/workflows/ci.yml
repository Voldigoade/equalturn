name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux checks and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: equalturn
          POSTGRES_USER: equalturn
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U equalturn -d equalturn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CARGO_TERM_COLOR: always
      TEST_DATABASE_URL: postgres://equalturn@127.0.0.1:5432/equalturn
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-on-failure: false

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file Cargo.lock

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install registry validator dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/equalturn-registry-env"
          "$RUNNER_TEMP/equalturn-registry-env/bin/python" -m pip install --disable-pip-version-check --requirement requirements-registry.txt
          echo "$RUNNER_TEMP/equalturn-registry-env/bin" >> "$GITHUB_PATH"

      - name: Validate AI research registry
        run: |
          python3 tools/validate_registry.py
          python3 tools/validate_registry_v3.py
          python3 tools/migrate_registry_v2_to_v3.py --check
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover --start-directory tests --pattern 'test_registry_*.py'

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

  windows:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-on-failure: false

      - name: Build and run platform-independent tests
        run: cargo test --workspace --locked
