name: Staging registry smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/registry-staging-smoke.yml
      - crates/registry/tests/fixtures/staging-root.json
      - crates/registry/tests/staging_smoke.rs
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: registry-staging-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-on-failure: false

      - name: Wait for the approved staging root to be served
        env:
          EXPECTED_ROOT_SHA256: 719e372ecc71e8f509f5805889560382d3d599971b82947f9da825101f323144
          ROOT_URL: https://voldigoade.github.io/equalturn-registry-staging/metadata/root.json
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/equalturn-staging-root.json"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --max-time 5 "$ROOT_URL" --output "$root"; then
              actual="$(sha256sum "$root" | cut -d ' ' -f 1)"
              if [ "$actual" = "$EXPECTED_ROOT_SHA256" ]; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Staging root did not match the pinned non-production root after 3 minutes." >&2
          exit 1

      - name: Verify and install the public staging registry
        run: cargo test -p equalturn-registry --test staging_smoke --locked -- --ignored
